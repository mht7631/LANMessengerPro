name: Windows Portable Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka
      - name: Build single-file executable
        run: python build.py
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/LANMessenger.exe")) {
            throw "Nuitka did not produce dist/LANMessenger.exe"
          }
          Get-Item "dist/LANMessenger.exe" | Format-List Name,Length,LastWriteTime
      - uses: actions/upload-artifact@v4
        with:
          name: LANMessengerPro-Windows-x64
          path: dist/LANMessenger.exe
          if-no-files-found: error
          retention-days: 14
